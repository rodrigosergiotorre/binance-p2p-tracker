name: Recolector P2P Binance

# Corre CADA HORA, todo el dia, en los servidores de GitHub (gratis).
# Tu Mac no tiene que estar prendida.
#
# Cuota: GitHub Free da 2.000 minutos/mes en repos privados y redondea cada
# ejecucion a 1 minuto. 24 al dia = ~730 al mes. Entra comodo.
on:
  schedule:
    - cron: "0 * * * *"     # cada hora en punto (UTC)
  workflow_dispatch:          # boton para correrlo a mano cuando quieras probar

# Permiso para que la accion pueda guardar el data.csv actualizado en el repo
permissions:
  contents: write

jobs:
  recolectar:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el repositorio
        uses: actions/checkout@v6

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Tomar lectura de precios
        run: python scrape.py

      # El historico diario es un extra. Si Yadio esta caido no debe hacer
      # fallar la recoleccion, que es lo importante: por eso el "|| true".
      - name: Actualizar historico diario (Yadio)
        run: python historico.py || true

      - name: Guardar la lectura en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "Sin cambios que guardar" && exit 0
          git commit -m "lectura: $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Por si tocaste algo en la web mientras corria: reintegramos y subimos
          git pull --rebase
          git push

